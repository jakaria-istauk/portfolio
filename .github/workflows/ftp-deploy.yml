# Uploads an already-built site to the FTP host.
#
# This workflow never builds. `npm run deploy:ftp` builds locally and pushes the
# output to the ftp-deploy branch; this job only transfers that branch's files.
# GitHub Pages is unaffected — it still comes from the gh-pages branch.
#
# Required repository secrets:
#   FTP_SERVER    hostname, e.g. ftp.jakaria.com.bd (no ftp:// prefix)
#   FTP_USERNAME  FTP account user
#   FTP_PASSWORD  FTP account password
# Optional repository variable:
#   FTP_SERVER_DIR  remote path, with a trailing slash. Defaults to ./, because
#                   this host drops the FTP user straight into the web root —
#                   a public_html/ value would nest the site one level deep.
name: FTP Deploy

on:
  push:
    branches: [ftp-deploy]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Repo plumbing has no place in the web root.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
