    <script>
      // Runs before first paint so a stored theme never flashes the other one.
      // No attribute means "system": the stylesheet's prefers-color-scheme
      // rules decide, and they keep deciding if the setting changes mid-visit.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored
          }
        } catch (e) {}
      })()
    </script>
