<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The typeface is requested here rather than by an @import inside the
         stylesheet. An @import cannot start until the CSS that contains it has
         downloaded and parsed, which puts the font behind a chain of three
         requests; a link in the head is discovered with the document itself. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap"
    />

    <!-- max-image-preview:large opts the case study screenshots into full-size
         thumbnails in search results and Discover, rather than the small
         default. index,follow is the default, stated so it is deliberate. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The build rewrites the title, this description and the canonical URL
         per page. Keep them as single-line tags: scripts/prerender.mjs matches
         them by pattern and fails the build if a pattern stops matching. -->
    <meta name="description" content="WordPress and full-stack engineer, seven years in. Custom plugins, themes and Elementor widgets, React and Node.js products, code running on 2M+ sites." />
    <meta name="author" content="Jakaria Istauk" />
    <!-- Absolute, and always the canonical host: the GitHub project page and
         the www hostname serve these same files, and this is what tells search
         engines which address owns the content. -->
    <link rel="canonical" href="https://jakaria.com.bd/" />
    <title>Jakaria Istauk — WordPress &amp; Full-Stack Engineer</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-73HVVX4XDF"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())

      gtag('config', 'G-73HVVX4XDF')
    </script>
    <script>
      // Runs before first paint so a stored theme never flashes the other one.
      // No attribute means "system": the stylesheet's prefers-color-scheme
      // rules decide, and they keep deciding if the setting changes mid-visit.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
